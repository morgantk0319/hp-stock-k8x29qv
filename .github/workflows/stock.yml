name: stock-check
on:
  schedule: [{cron: "*/15 * * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests && python check_stock.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - run: |
          git config user.name bot && git config user.email bot@example.com
          git add state.json && git commit -m "update" || true
          git push
